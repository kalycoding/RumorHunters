[project]
name = "rumor-hunters-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "httpx",
    "fastapi>=0.151.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # sample post text
